name: GitHub Pages
on:
  push:
    branches: [main]
  # Sent by a project repo's docs workflow when its docs change (see
  # scripts/build-project-docs.sh), so /projects/<name>/ is rebuilt without
  # a commit here.
  repository_dispatch:
    types: [project-docs-updated]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: hugo --minify
      # Builds each project's MkDocs site into public/projects/<name>/. Runs
      # after hugo so the project card in content/projects/ (which only links
      # here, see `build.render` there) never collides with the docs.
      - run: scripts/build-project-docs.sh
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      - uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
