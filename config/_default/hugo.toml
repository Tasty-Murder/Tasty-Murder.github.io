theme                  = "blowfish"
baseURL                = "https://tasty-murder.github.io/"
defaultContentLanguage = "en"
enableRobotsTXT        = true
summaryLength          = 0

[pagination]
  pagerSize = 10

[outputs]
  home    = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  page    = ["HTML"]

# Serve the feed at /feed.xml (Hugo's default is /index.xml). Only baseName is
# overridden; Hugo merges the rest from the built-in RSS format defaults.
[outputFormats]
  [outputFormats.rss]
    baseName = "feed"

[services]
  [services.rss]
    limit = 20

[permalinks]
  research = "/research/:slug/"
  projects = "/projects/:slug/"

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"
